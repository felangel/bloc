name: sonarqube

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: Análise SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: necessário para blame e new code

      - name: Setup Flutter (inclui Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar ferramentas
        run: dart pub global activate coverage

      - name: Testes com cobertura (todos os pacotes)
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            [ -f "$pkg/pubspec.yaml" ] || continue
            [ -d "$pkg/test" ] || { echo "Sem testes em $pkg"; continue; }
            echo "::group::$pkg"
            pushd "$pkg" > /dev/null
            if grep -q "sdk: flutter" pubspec.yaml; then
              flutter pub get
              flutter test --coverage
            else
              dart pub get
              dart test --coverage=coverage
              dart pub global run coverage:format_coverage \
                --lcov --in=coverage --out=coverage/lcov.info \
                --report-on=lib --packages=.dart_tool/package_config.json
            fi
            popd > /dev/null
            echo "::endgroup::"
          done
        continue-on-error: true # a análise roda mesmo se algum teste falhar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
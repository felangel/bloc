sonar.projectKey=anamgholanda_bloc
sonar.organization=anamgholanda
sonar.projectName=bloc
sonar.sourceEncoding=UTF-8

# Código-fonte e testes dos pacotes do monorepo
sonar.sources=packages
sonar.inclusions=packages/*/lib/**/*.dart
sonar.tests=packages
sonar.test.inclusions=packages/*/test/**/*.dart

# Exclusões (código gerado, exemplos, docs)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/example/**,**/*.md

# Cobertura (requer o plugin comunitário sonar-flutter, ver observações)
sonar.dart.lcov.reportPaths=packages/bloc/coverage/lcov.info,\
packages/bloc_concurrency/coverage/lcov.info,\
packages/bloc_test/coverage/lcov.info,\
packages/flutter_bloc/coverage/lcov.info,\
packages/hydrated_bloc/coverage/lcov.info,\
packages/replay_bloc/coverage/lcov.info